name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - name: Install (CPU)
        run: |
          python -m pip install -r requirements/cpu.txt -r requirements/dev.txt
          python -m pip install -e . --no-deps
      - name: Lint
        run: python -m ruff check src tests scripts docs/diagrams
      - name: SQL smoke test (no model files)
        run: make sql-smoke PY=python
      - name: Cache models
        uses: actions/cache@v4
        with:
          path: models
          key: models-${{ hashFiles('artifacts/release_v1.0.0.json') }}
      - name: Download models (release asset, SHA-256 checked)
        env:
          GH_TOKEN: ${{ github.token }}
        run: test -f models/task_a/joint_tree.ubj || python scripts/download_artifacts.py models
      - name: Tests (end-to-end on the mini input, no-lookahead, input validation, metric)
        run: python -m pytest -q
