[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "outage-forecast"
version = "1.0.0"
description = "Weather-driven power-outage risk forecasting for AI data centers (XGBoost + GRU, point-in-time features)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
authors = [{ name = "lishuangyi" }]
dependencies = ["duckdb==2.0.0", "numpy==2.5.2", "polars==1.43.2", "torch==2.11.0", "xgboost==3.4.1"]

[project.optional-dependencies]
dev = ["pytest==9.0.3", "ruff==0.17.5", "scikit-learn==1.9.0"]
notebook = ["ipykernel==7.4.0", "matplotlib==3.11.1"]

[project.scripts]
outage-forecast = "outage_forecast.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 130
target-version = "py312"
extend-exclude = ["notebooks", "data", "models"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E731", "E741"]

[tool.ruff.lint.isort]
known-first-party = ["outage_forecast", "conftest", "scoring"]
